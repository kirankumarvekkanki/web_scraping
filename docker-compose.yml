version: '3.8'

services:
  web-scraper:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SCRAPER_API_HOST=0.0.0.0
      - SCRAPER_API_PORT=8000
      - SCRAPER_LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml
    command: ["python", "main.py", "--api", "--config", "config.yaml"]
    restart: unless-stopped
    
  # Optional: Redis for caching and job queue
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    
  # Optional: Database for storing results
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: scraper
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: