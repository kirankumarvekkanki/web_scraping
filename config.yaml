# Web Scraping Framework Configuration
# This is a sample configuration file with all available options

# Crawler configuration
crawler:
  max_retries: 3                    # Maximum retry attempts for failed requests
  delay: 1.0                        # Delay between requests in seconds
  timeout: 30                       # Request timeout in seconds
  user_agent_rotation: true         # Rotate user agents
  respect_robots_txt: true          # Respect robots.txt files
  
  # JavaScript crawler settings
  headless: true                    # Run browser in headless mode
  browser_type: "chromium"          # Browser type: chromium, firefox, webkit
  page_load_timeout: 30000          # Page load timeout in milliseconds
  navigation_timeout: 30000         # Navigation timeout in milliseconds
  
  # PDF crawler settings
  extract_images: true              # Extract images from PDFs
  extract_tables: true              # Extract table data from PDFs
  preserve_layout: true             # Preserve document layout

# Proxy management
proxy:
  enabled: false                    # Enable proxy rotation
  proxy_sources: []                 # List of proxy URLs or sources
  # Example proxy sources:
  # - "http://proxy1.example.com:8080"
  # - "http://user:pass@proxy2.example.com:8080"
  max_failures: 3                  # Max failures before marking proxy as bad
  health_check_interval: 300       # Health check interval in seconds
  rotation_strategy: "round_robin"  # Rotation strategy: round_robin, random, least_used
  proxy_timeout: 10                 # Proxy connection timeout

# Field extraction configuration
extraction:
  preserve_formatting: true        # Preserve special formatting (subscripts, etc.)
  default_formatting_type: "auto"  # Default formatting: auto, unicode, html, latex, markdown
  include_confidence_scores: true  # Include confidence scores in results
  include_alternatives: false      # Include alternative matches
  max_alternatives: 5              # Maximum number of alternative matches
  pattern_timeout: 5.0             # Timeout for pattern matching in seconds

# AI enhancement settings
ai:
  enabled: false                   # Enable AI-powered features
  openai_api_key: null             # OpenAI API key (or set OPENAI_API_KEY env var)
  model: "gpt-3.5-turbo"          # AI model to use
  max_tokens: 1000                 # Maximum tokens for AI responses
  temperature: 0.7                 # AI response creativity (0.0-1.0)
  use_local_models: false          # Use local transformer models
  local_model_path: null           # Path to local model files

# API server configuration
api:
  host: "127.0.0.1"               # Host to bind the server
  port: 8000                       # Port to bind the server
  workers: 1                       # Number of worker processes
  max_concurrent_jobs: 10          # Maximum concurrent background jobs
  job_cleanup_interval: 3600       # Job cleanup interval in seconds
  enable_cors: true                # Enable CORS
  cors_origins:                    # Allowed CORS origins
    - "*"
  rate_limit_enabled: false       # Enable rate limiting
  rate_limit_requests: 100        # Requests per window
  rate_limit_window: 60           # Rate limit window in seconds

# Logging configuration
logging:
  level: "INFO"                    # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "standard"               # Log format: standard, structured
  console_output: true             # Enable console logging
  file_output: false               # Enable file logging
  log_file: null                   # Log file path
  max_file_size: 10485760         # Max log file size in bytes (10MB)
  backup_count: 5                  # Number of backup log files
  structured_logging: false       # Use structured JSON logging

# Global settings
debug: false                       # Enable debug mode
data_dir: "./data"                # Data directory path
temp_dir: "./temp"                # Temporary files directory
cache_enabled: true               # Enable caching
cache_ttl: 3600                   # Cache TTL in seconds